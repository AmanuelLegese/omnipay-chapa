# PHP and Composer run in containers - nothing is installed on the host.
#
#   docker compose run --rm composer install
#   docker compose run --rm test
#   docker compose run --rm style
#   docker compose run --rm shell
#
# Reproduce a CI matrix cell by picking the PHP version:
#   PHP_VERSION=8.1 docker compose build
#   PHP_VERSION=8.1 docker compose run --rm test
#
# One image serves every service, so Composer resolves dependencies against the
# exact PHP that later runs them. Splitting the two (the composer:2 image ships
# PHP 8.4, php:8.3-cli-alpine does not) makes Composer write a platform_check.php for
# the wrong version and every run aborts before autoloading.

x-php: &php
  build:
    context: .
    args:
      PHP_VERSION: ${PHP_VERSION:-8.3}
  image: omnipay-chapa-dev:php${PHP_VERSION:-8.3}
  # Containers run as real root, so without this vendor/ comes back root-owned
  # and you can no longer edit or delete it. Override in .env if your id differs.
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /app
  volumes:
    # :z relabels the bind mount for SELinux (Fedora); a no-op on other hosts.
    - .:/app:z
    # Keeps Composer's download cache across runs.
    - composer-cache:/tmp/composer

services:
  composer:
    <<: *php
    entrypoint: ["composer"]

  test:
    <<: *php
    entrypoint: ["vendor/bin/phpunit"]

  style:
    <<: *php
    entrypoint: ["vendor/bin/phpcs", "-p", "--standard=PSR2", "src/"]

  fix:
    <<: *php
    entrypoint: ["vendor/bin/phpcbf", "-p", "--standard=PSR2", "src/"]

  shell:
    <<: *php
    entrypoint: ["bash"]

volumes:
  composer-cache:
